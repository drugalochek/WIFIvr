name: Build VRoom

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build VRoom for Windows
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Windows/VRoom/VRoom.csproj
      - name: Build
        run: dotnet build Windows/VRoom/VRoom.csproj --configuration Release --no-restore
      - name: Publish VRoom Windows app
        run: >
          dotnet publish Windows/VRoom/VRoom.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output artifacts/VRoom-Windows-x64
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: VRoom-Windows-x64
          path: artifacts/VRoom-Windows-x64/
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Build VRoom Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download MediaPipe hand model
        run: |
          mkdir -p Android/app/src/main/assets
          curl --fail --location --retry 3 https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task --output Android/app/src/main/assets/hand_landmarker.task
          curl --fail --location --retry 3 https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task --output Android/app/src/main/assets/pose_landmarker_lite.task
      - name: Build VRoom APK
        working-directory: Android
        run: gradle :app:assembleDebug
      - name: Upload VRoom APK
        uses: actions/upload-artifact@v4
        with:
          name: VRoom-Android-debug
          path: Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  build-openvr-driver:
    name: Build SteamVR OpenVR driver
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Install CMake
        uses: lukka/get-cmake@latest
      - name: Fetch OpenVR SDK headers
        shell: pwsh
        run: git clone --depth 1 https://github.com/ValveSoftware/openvr.git "$env:RUNNER_TEMP/openvr"
      - name: Configure OpenVR driver
        shell: pwsh
        run: cmake -S SteamVRDriver -B SteamVRDriver/build -A x64 -DOPENVR_INCLUDE_DIR="$env:RUNNER_TEMP/openvr/headers"
      - name: Compile OpenVR driver
        run: cmake --build SteamVRDriver/build --config Release
      - name: Package SteamVR driver
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/driver_vroom/bin/win64 | Out-Null
          New-Item -ItemType Directory -Force artifacts/driver_vroom/resources/settings | Out-Null
          Copy-Item SteamVRDriver/build/Release/driver_vroom.dll artifacts/driver_vroom/bin/win64/
          Copy-Item SteamVRDriver/driver.vrdrivermanifest artifacts/driver_vroom/
          Copy-Item SteamVRDriver/resources/settings/default.vrsettings artifacts/driver_vroom/resources/settings/
      - name: Upload SteamVR driver
        uses: actions/upload-artifact@v4
        with:
          name: VRoom-SteamVR-driver
          path: artifacts/driver_vroom/
          if-no-files-found: error
          retention-days: 14
