name: Build WiFiVR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows receiver
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Windows/WiFiVR.Receiver/WiFiVR.Receiver.csproj

      - name: Build
        run: dotnet build Windows/WiFiVR.Receiver/WiFiVR.Receiver.csproj --configuration Release --no-restore

      - name: Publish Windows x64 single-file app
        run: >-
          dotnet publish Windows/WiFiVR.Receiver/WiFiVR.Receiver.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output artifacts/WiFiVR-Receiver-win-x64

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: WiFiVR-Receiver-win-x64
          path: artifacts/WiFiVR-Receiver-win-x64/
          if-no-files-found: error
          retention-days: 14
